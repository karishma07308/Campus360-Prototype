<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus360 prototype</title>
<style>
:root{--bg:#f1f6f9;--cd:#fff;--tx:#14212b;--mu:#586a77;--bd:#d8e3e9;--ac:#21436f;--on:#fff;--ok:#17653d;--okb:#dff2e6;--wn:#8a5200;--wnb:#fff0d1;--er:#9b2626;--erb:#fde7e7;--inf:#1b5f8a;--infb:#e0eef9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a23;--cd:#17262f;--tx:#e8f0f5;--mu:#9fb2bf;--bd:#293a45;--ac:#6aaee6;--on:#0b1620;--ok:#7fdca5;--okb:#12382a;--wn:#f3c46b;--wnb:#3b2c0d;--er:#f5a0a0;--erb:#3d1818;--inf:#8cc4ee;--infb:#14313f}}
:root[data-theme="dark"]{--bg:#0e1a23;--cd:#17262f;--tx:#e8f0f5;--mu:#9fb2bf;--bd:#293a45;--ac:#6aaee6;--on:#0b1620;--ok:#7fdca5;--okb:#12382a;--wn:#f3c46b;--wnb:#3b2c0d;--er:#f5a0a0;--erb:#3d1818;--inf:#8cc4ee;--infb:#14313f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 88px}
h1{font-size:21px;margin:4px 0 10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0}
.b{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.er{background:var(--erb);color:var(--er)}.in{background:var(--infb);color:var(--inf)}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:13px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ac);margin-right:5px}.dots i.f{background:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--ac)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--bd)}
.lk{text-decoration:line-through;color:var(--mu)}
.lb{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px}.lb span:first-child{width:78px}.lb b{width:34px;text-align:right}
.me{font-weight:700}
.fl{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--okb)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1}.seg .p{font-weight:700}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const CUT=[[90,10,'O'],[80,9,'A'],[70,8,'B'],[60,7,'C'],[50,6,'D'],[40,5,'P']],M=6e4,N=Date.now();
const S={tab:'home',user:0,phone:'',otp:0,err:'',target:8.5,t20:0,form:0,lb:'div',flash:'',me:'Comp-A',
sub:[{n:'Maths',c:4,i:30,e:40},{n:'Physics',c:3,i:28,e:40},{n:'Chemistry',c:3,i:15,e:40},{n:'Programming',c:4,i:34,e:40}],
rides:[{to:'Kurla station',v:'Sharing auto',by:'Riya',n:2,fixed:1,exp:N+20*M},{to:'Thane',v:'Cab',by:'Karan',n:3,fixed:0,total:480,exp:N+12*M},{to:'Dadar',v:'Meter auto',by:'Sneha',n:1,fixed:0,total:240,exp:N+18*M}],
divs:[{d:'Comp-A',b:'Computer Eng',p:120},{d:'Comp-B',b:'Computer Eng',p:150},{d:'Comp-C',b:'Computer Eng',p:90},{d:'IT-A',b:'IT',p:140},{d:'IT-B',b:'IT',p:110},{d:'AIDS-A',b:'AI and DS',p:130},{d:'EXTC-A',b:'EXTC',p:100}],
tasks:[{t:'Collect 20 books for the library drive',p:50,done:0},{t:'Attend the Friday coding workshop',p:30,done:0},{t:'Post a photo of the campus clean-up',p:40,done:0}]};
const gr=t=>CUT.find(c=>t>=c[0])||[0,0,'F'];
const sg=a=>{let n=0,d=0;S.sub.forEach((s,i)=>{n+=s.c*gr(a[i])[1];d+=s.c});return n/d};
const weak=()=>S.sub.reduce((a,b)=>b.i<a.i?b:a);
function go(){const v={home,planner,rides,chal}[S.tab];$('#app').innerHTML=S.user?v():login();
$('#nav').innerHTML=S.user?[['home','Home'],['planner','Planner'],['rides','Rides'],['chal','Challenges']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';go();scrollTo(0,0)">${t[1]}</button>`).join(''):''}
function login(){const e=S.err?`<p class="b er">${S.err}</p>`:'';
return `<h1>Campus360</h1><div class="c">`+(S.otp?`<div class="mu">Enter the 4-digit OTP sent to ${esc(S.phone)}. Demo OTP: 1234</div><p><input id="ot" inputmode="numeric" maxlength="4" placeholder="1234"></p>${e}<div class="row"><button onclick="S.otp=0;S.err='';go()">Change number</button><button class="p" onclick="verify()">Verify and log in</button></div>`
:`<div class="mu">Log in with your phone number</div><p><input id="ph" inputmode="tel" maxlength="10" placeholder="10-digit mobile number" value="${esc(S.phone)}"></p>${e}<button class="p" onclick="send()">Send OTP</button>`)+`</div><p class="mu">Prototype: login is simulated. MiniMoth phone OTP connects in the full build.</p>`}
function send(){const p=$('#ph').value.trim();S.phone=p;if(!/^\d{10}$/.test(p)){S.err='Enter a 10-digit number';return go()}S.err='';S.otp=1;go()}
function verify(){if($('#ot').value==='1234'){S.user=1;S.err='';S.tab='home'}else S.err='Wrong OTP. Try 1234';go()}
function t20(m){const w=weak();return m==15?`Revise the key formulas of ${w.n}.`:m==30?`Finish one chapter of ${w.n}, your weakest subject (${Math.round(w.i/.4)}%).`:`Submit the Programming lab report (due 6 pm), then finish one chapter of ${w.n}.`}
function home(){const w=weak(),need=Math.max(0,70-w.i),r=S.rides.find(x=>rs(x)=='Open');
return `<div class="row"><h1>Hi Aarav</h1><button onclick="S.user=0;S.otp=0;go()">Log out</button></div><div class="mu" style="margin:-6px 0 10px">First year, ${S.me}</div>
<div class="c" style="background:var(--wnb);border-color:transparent"><b style="color:var(--wn)">Planner alert</b><div>${w.n}: you need ${need} of 60 in the final for a B grade.</div></div>
<div class="c"><b>Today</b><div class="row"><span>10:00 Maths</span><span class="mu">Room 204</span></div><div class="row"><span>12:00 Physics lab</span><span class="mu">Lab 2</span></div><div class="row"><span>Programming lab report</span><span class="b wn">Due 6 pm</span></div></div>
<div class="c"><b>I have only...</b><div class="seg" style="margin:8px 0">${[15,30,60].map(m=>`<button class="${S.t20==m?'p':''}" onclick="S.t20=${m};go()">${m} min</button>`).join('')}</div><div>${S.t20?t20(S.t20):'<span class="mu">Pick your free time and get one task.</span>'}</div></div>
<div class="c"><b>Events</b><div class="row"><span>Coding workshop</span><span class="b ok">Live now</span></div><div class="row"><span>Robotics talk</span><span class="b wn">Starting soon</span></div><div class="row"><span>Quiz night</span><span class="b in">Registration open</span></div></div>
${r?`<div class="c"><div class="row"><b>Ride to ${esc(r.to)}</b><span class="b ok">${r.n} of 4 seats filled</span></div><button onclick="S.tab='rides';go()">See rides</button></div>`:''}`}
function planner(){const tot=S.sub.map(s=>s.i+s.e),best=sg(S.sub.map(s=>s.i+60)),cur=sg(tot),ok=best>=S.target;
return `<h1>Academic planner</h1><div class="c"><div class="mu">Sample scale: O 90, A 80, B 70, C 60, D 50, P (pass) 40. The real scale is set at the event.</div>
<div class="row"><label for="tg">Target SGPA</label><input id="tg" style="width:90px" type="number" step="0.1" min="5" max="10" value="${S.target}" onchange="S.target=+this.value;go()"></div>
<div class="row"><span class="b ${ok?'ok':'er'}">${ok?'Achievable':'Not achievable'}</span><span>Best possible: <b>${best.toFixed(2)}</b></span></div>
<div class="row"><span>What-if SGPA with your final marks</span><b>${cur.toFixed(2)}</b></div></div>`+
S.sub.map((s,i)=>`<div class="c"><div class="row"><b>${s.n}</b><span class="mu">${s.c} credits</span></div>
<div class="row"><span>Internal (out of 40)</span><input aria-label="Internal marks" style="width:76px" type="number" min="0" max="40" value="${s.i}" onchange="S.sub[${i}].i=Math.min(40,Math.max(0,+this.value||0));go()"></div>
<div class="row"><span>What-if final: <b>${s.e}</b> of 60</span><input aria-label="What-if final marks" style="width:48%" type="range" min="0" max="60" value="${s.e}" onchange="S.sub[${i}].e=+this.value;go()"></div>
<div class="sc"><table><tr><th>Grade</th><th>Marks needed in final</th></tr>${CUT.map(c=>{const n=c[0]-s.i;return `<tr><td>${c[2]}</td><td class="${n>60?'lk':''}">${n>60?'Locked':n<=0?'Secured':n+' of 60'}</td></tr>`}).join('')}</table></div>
<div class="mu" style="margin-top:6px">With what-if: grade ${gr(s.i+s.e)[2]}${s.i+s.e<40?' (below pass mark)':''}</div></div>`).join('')}
function rs(r){return r.cx?'Cancelled':r.n>=4?'Full':Date.now()>r.exp?'Expired':'Open'}
function rides(){return `<div class="row"><h1>Rides</h1><button class="p" onclick="S.form=!S.form;go()">${S.form?'Close':'Post a ride'}</button></div>`+
(S.form?`<div class="c"><label class="mu" for="ft">Going to</label><input id="ft" value="Kurla station"><label class="mu" for="fv">Vehicle</label><select id="fv"><option>Sharing auto</option><option>Meter auto</option><option>Cab</option></select><label class="mu" for="fa">Estimated total fare in Rs (meter auto or cab)</label><input id="fa" type="number" value="120"><p class="mu">You take 1 of 4 seats. The ride expires in 15 minutes.</p><button class="p" onclick="post()">Post ride</button></div>`:'')+
S.rides.map((r,i)=>{const st=rs(r),f=r.fixed?30:Math.round(r.total/r.n),m=Math.max(0,Math.ceil((r.exp-Date.now())/M)),c=st=='Open'?'ok':st=='Full'?'in':'er';
const act=r.mine?(st=='Open'?`<button onclick="join(${i})">Simulate a join</button> <button onclick="cancel(${i})">Cancel ride</button>`:''):r.req=='Confirmed'?'<span class="b ok">Confirmed</span>':r.req=='Requested'?'<span class="b wn">Requested</span>':st=='Open'?`<button class="p" onclick="req(${i})">Request seat</button>`:'';
return `<div class="c"><div class="row"><b>VESIT to ${esc(r.to)}</b><span class="b ${c}">${st}</span></div><div class="mu">${r.v}, posted by ${esc(r.by)}${st=='Open'?', '+m+' min left':''}</div>
<div class="row"><span class="dots">${[0,1,2,3].map(k=>`<i class="${k<r.n?'f':''}"></i>`).join('')}</span><span><b>Rs ${f}</b> each</span></div>${act}</div>`}).join('')}
function post(){const v=$('#fv').value,t=+$('#fa').value||120;S.rides.unshift({to:$('#ft').value.trim()||'Kurla station',v,by:'You',n:1,fixed:v=='Sharing auto'?1:0,total:t,exp:Date.now()+15*M,mine:1});S.form=0;go()}
function req(i){const r=S.rides[i];r.req='Requested';go();setTimeout(()=>{if(r.n<4)r.n++;r.req='Confirmed';go()},2200)}
function join(i){if(S.rides[i].n<4)S.rides[i].n++;go()}
function cancel(i){S.rides[i].cx=1;go()}
function chal(){let a=S.divs.map(x=>({n:x.d,b:x.b,p:x.p}));if(S.lb=='br'){const m={};a.forEach(x=>m[x.b]=(m[x.b]||0)+x.p);a=Object.keys(m).map(k=>({n:k,b:k,p:m[k]}))}
a.sort((x,y)=>y.p-x.p);const mx=a[0].p;
return `<h1>Class challenges</h1><div class="seg"><button class="${S.lb=='div'?'p':''}" onclick="S.lb='div';go()">Divisions</button><button class="${S.lb=='br'?'p':''}" onclick="S.lb='br';go()">Branches</button></div>
<div class="c">${a.map((x,i)=>{const me=x.n==S.me||(S.lb=='br'&&x.n=='Computer Eng');return `<div class="lb ${me?'me':''} ${me&&S.flash?'fl':''}"><span>${i+1}. ${x.n}</span><div class="bar"><i style="width:${Math.round(x.p/mx*100)}%"></i></div><b>${x.p}</b></div>`}).join('')}<div class="mu">Sample division names. Real ones are set at the event.</div></div>
<b>Open tasks for ${S.me}</b><div style="margin-top:8px">${S.tasks.map((t,i)=>`<div class="c"><div class="row"><span>${t.t}</span><span class="b in">${t.p} pts</span></div><button class="${t.done?'':'p'}" ${t.done?'disabled':''} onclick="done(${i})">${t.done?'Completed':'Mark complete'}</button></div>`).join('')}</div>`}
function done(i){const t=S.tasks[i];if(t.done)return;t.done=1;S.divs.find(d=>d.d==S.me).p+=t.p;S.flash=1;go();setTimeout(()=>{S.flash=0},1300)}
setInterval(()=>{if(S.user&&S.tab=='rides'&&!S.form&&!document.activeElement.matches('input,select'))go()},30000);
go();
</script></body></html>
